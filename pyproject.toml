[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odata-mcp-server"
version = "0.1.0"
description = "Connect any OData V2/V4 service to LLMs via the Model Context Protocol"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Naveen Kumar Baskaran" },
]
keywords = ["odata", "mcp", "llm", "ai-agents", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
odata-mcp = "odata_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/odata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
